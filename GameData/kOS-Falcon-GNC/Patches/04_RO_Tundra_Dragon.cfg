// Dragon 2 Unpressurized Trunk (3.7 m dia, ~1.5 t dry, ~2.0 kW solar array + radiators)
@PART[TE_18_DRAGONV2_TRUNK]:FOR[RealismOverhaul]:HAS[~RSSROConfig[True]]:NEEDS[RealismOverhaul,TundraExploration]
{
	%RSSROConfig = True
	%kOSFalconGNC_BaseRO = True
	%rescaleFactor = 1.48

	@title = Dragon 2 Unpressurized Trunk
	@manufacturer = SpaceX
	@description = Unpressurized cargo trunk (37 m^3 capacity) wrapped with 2.0 kW body-mounted solar cells on one side, thermal rejection radiators on the other, and aerodynamic launch-abort stabilizing fins.

	@mass = 1.5
	@crashTolerance = 12
	%breakingForce = 250
	%breakingTorque = 250
	%skinTempTag = Solar
	%internalTempTag = Instruments

	@RESOURCE[ElectricCharge]
	{
		@amount = 10000
		@maxAmount = 10000
	}

	@MODULE[ModuleCurvedSolarPanel]:NEEDS[NearFutureSolar]
	{
		@TotalEnergyRate = 2.0
	}

	@MODULE[ModuleDeployableSolarPanel]:NEEDS[!NearFutureSolar],*
	{
		@chargeRate = 1.0
	}

	@MODULE[ModuleActiveRadiator]
	{
		@maxEnergyTransfer = 150
		@RESOURCE[ElectricCharge]
		{
			@rate = 0.05
		}
	}
}

