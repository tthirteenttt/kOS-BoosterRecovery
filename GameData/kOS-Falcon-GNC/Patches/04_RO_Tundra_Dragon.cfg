// ============================================================================
// kOS-Falcon-GNC - Clean-Room Realism Overhaul Patches for Tundra Exploration
// Subsystem: Dragon 1 (GiganV2), Dragon 2 Crew/Cargo/I4 (RodanV2), Dragon XL
// License:   MIT (Decal textures derived from nessux/TundraExploration4RO, MIT)
// Sources:   Wikipedia SpaceX Dragon 2 & Dragon 1 tables, SpaceX Falcon User's
//            Guide (Mar 2025), official RO SuperDraco_Config.cfg & RO_Heatshields.
//
// Verified Dragon 2 Baseline:
//   Diameter: 3.7 m base / 4.0 m max (1.48x stock 2.5 m)
//   Dry mass: ~6.2 t capsule (4.8 t pod + 1.0 t PICA-3 shield + 0.4 t chutes)
//             + 1.5 t trunk = 7.7 t total dry (~12.5 t wet with 2.56 t NTO/MMH)
//   Propulsion: 8x SuperDraco (568 kN Vac / 488 kN SL, 280/240 s, MMH/NTO/He),
//               16x Draco RCS (0.4 kN each, 300/110 s, MMH/NTO)
//   Recovery: 2x Drogue chutes (D_eq = 7.8 m) + 4x 35 m Mains (D_eq = 70 m)
//   Power: Trunk curved solar array ~2.0 kW
// ============================================================================

// ============================================================================
// SECTION 1: DRAGON 2 CREW / INSPIRATION4 / CARGO (RodanV2)
// ============================================================================

@PART[TE_18_DRAGONV2_POD|TE_18_DRAGONV2_POD_I4]:FOR[RealismOverhaul]:HAS[~RSSROConfig[True]]:NEEDS[RealismOverhaul,TundraExploration]
{
	%RSSROConfig = True
	%kOSFalconGNC_BaseRO = True
	%rescaleFactor = 1.48

	@manufacturer = SpaceX
	@mass = 4.8
	@CrewCapacity = 4
	@crashTolerance = 14
	%breakingForce = 250
	%breakingTorque = 250
	%skinTempTag = HRSI
	%internalTempTag = Instruments
	%CoMOffset = 0, -0.45, 0

	!RESOURCE[*],* {}
	!MODULE[ModuleReactionWheel],* {}
	!MODULE[ModuleFuelTanks],* {}
	!MODULE[ModuleB9PartSwitch]:HAS[#moduleID[TE_Service]] {}
	!MODULE[ModuleB9PartSwitch]:HAS[#moduleID[TE_VolumeBias]] {}

	@MODULE[ModuleCommand]
	{
		%RESOURCE[ElectricCharge]
		{
			%rate = 1.2
		}
	}

	// Offset center of mass for lifting reentry (L/D ~ 0.24)
	MODULE
	{
		name = AdjustableCoMShifter
		DescentModeCoM = 0.0, -0.45, 0.14
	}

	// Integrated 8x SuperDraco Launch Escape System (71 kN x 8 = 568 kN Vac)
	@MODULE[ModuleEngines*]
	{
		@name = ModuleEnginesRF
		@minThrust = 113.6
		@maxThrust = 568.0
		@heatProduction = 100
		%ullage = False
		%pressureFed = True
		%ignitions = 0

		!PROPELLANT,* {}
		PROPELLANT
		{
			name = MMH
			ratio = 0.5561
			DrawGauge = True
		}
		PROPELLANT
		{
			name = NTO
			ratio = 0.4439
			DrawGauge = False
		}
		PROPELLANT
		{
			name = Helium
			ratio = 103.35
			ignoreForIsp = True
		}

		!atmosphereCurve {}
		atmosphereCurve
		{
			key = 0 280
			key = 1 240
		}
	}

	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEnginesRF
		configuration = SuperDraco-8
		modded = False

		CONFIG
		{
			name = SuperDraco-8
			description = Eight pressure-fed SuperDraco hypergolic launch escape thrusters (71 kN each, deep throttling 20-100%).
			minThrust = 113.6
			maxThrust = 568.0
			heatProduction = 100
			ullage = False
			pressureFed = True
			ignitions = 0
			PROPELLANT
			{
				name = MMH
				ratio = 0.5561
				DrawGauge = True
			}
			PROPELLANT
			{
				name = NTO
				ratio = 0.4439
				DrawGauge = False
			}
			PROPELLANT
			{
				name = Helium
				ratio = 103.35
				ignoreForIsp = True
			}
			atmosphereCurve
			{
				key = 0 280
				key = 1 240
			}
		}
	}

	// 16x Draco hypergolic attitude & orbital maneuvering thrusters (400 N each)
	@MODULE[ModuleRCSFX],*
	{
		@thrusterPower = 0.4
		!resourceName = DELETE
		!PROPELLANT,* {}
		PROPELLANT
		{
			name = MMH
			ratio = 0.5036
			resourceFlowMode = STAGE_PRIORITY_FLOW
		}
		PROPELLANT
		{
			name = NTO
			ratio = 0.4964
			resourceFlowMode = STAGE_PRIORITY_FLOW
		}
		!atmosphereCurve {}
		atmosphereCurve
		{
			key = 0 300
			key = 1 110
			key = 4 0.001
		}
	}

	// ~2,562 kg MMH/NTO + Helium pressurant + batteries + crew life support space
	MODULE
	{
		name = ModuleFuelTanks
		type = ServiceModule
		volume = 2850
		basemass = -1
		TANK
		{
			name = ElectricCharge
			amount = 86400
			maxAmount = 86400
		}
		TANK
		{
			name = MMH
			amount = 1190
			maxAmount = 1190
		}
		TANK
		{
			name = NTO
			amount = 1040
			maxAmount = 1040
		}
		TANK
		{
			name = Helium
			amount = 240000
			maxAmount = 240000
		}
	}

	!MODULE[ModuleDataTransmitter]:NEEDS[RealAntennas] {}
	MODULE:NEEDS[RealAntennas]
	{
		name = ModuleRealAntenna
		referenceGain = 1.5
		RFBand = S
	}
}

@PART[TE_18_DRAGONV2_POD]:FOR[RealismOverhaul]:HAS[#kOSFalconGNC_BaseRO[True]]:NEEDS[RealismOverhaul,TundraExploration]
