// Dragon 2 Drogue Parachutes (2x conical ribbon drogues, D_eq = 7.8 m)
@PART[TE_CD2_POD_DROGUES]:FOR[RealismOverhaul]:HAS[~RSSROConfig[True]]:NEEDS[RealismOverhaul,TundraExploration]
{
	%RSSROConfig = True
	%kOSFalconGNC_BaseRO = True
	%rescaleFactor = 1.48

	@title = Dragon 2 Drogue Parachute Pack (2x)
	@manufacturer = SpaceX
	@description = Dual conical ribbon drogue parachutes stabilizing and decelerating Dragon 2 at ~5.5 km altitude prior to main canopy extraction.

	@mass = 0.08
	@crashTolerance = 12
	%breakingForce = 250
	%breakingTorque = 250
	%skinTempTag = Nomex
	%internalTempTag = Instruments

	!MODULE[ModuleParachute]:NEEDS[RealChute],* {}
	!MODULE[ModuleDragModifier]:NEEDS[RealChute],* {}

	MODULE:NEEDS[RealChute]
	{
		name = RealChuteModule
		caseMass = 0.04
		timer = 0
		mustGoDown = False
		spareChutes = 1
		cutSpeed = 0.5

		PARACHUTE
		{
			parachuteName = canopyCD2
			capName = TE_23_CD2_DROGUE_DOOR
			preDeploymentAnimation = semiDeployLarge_1
			deploymentAnimation = fullyDeployLarge_1
			material = Kevlar
			minIsPressure = False
			minPressure = 0.01
			preDeployedDiameter = 3.5
			preDeploymentSpeed = 1.5
			minDeployment = 5500
			deployedDiameter = 7.8
			deploymentSpeed = 3.0
			deploymentAlt = 5200
			cutAlt = 1800
		}
	}
}

