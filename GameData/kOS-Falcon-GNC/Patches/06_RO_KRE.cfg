@PART[SmallCapsuleEngineRCS]:FOR[RealismOverhaul]:HAS[~RSSROConfig[True]]:NEEDS[RealismOverhaul,KerbalReusabilityExpansion]
{
	%RSSROConfig = True
	%kOSFalconGNC_BaseRO = True
	%rescaleFactor = 1.48
	%engineType = SuperDraco
	%engineTypeMult = 2

	@title = SuperDraco Dual Nacelle + Draco RCS (KRE)
	@manufacturer = SpaceX
	@description = Twin-engine SuperDraco hypergolic thruster pod with integrated 400 N Draco attitude-control thrusters.

	%breakingForce = 250
	%breakingTorque = 250

	@MODULE[ModuleRCSFX]
	{
		@thrusterPower = 0.4
		!resourceName = DELETE
		!PROPELLANT,* {}
		PROPELLANT
		{
			name = MMH
			ratio = 0.5036
			resourceFlowMode = STAGE_PRIORITY_FLOW
		}
		PROPELLANT
		{
			name = NTO
			ratio = 0.4964
			resourceFlowMode = STAGE_PRIORITY_FLOW
		}
		!atmosphereCurve {}
		atmosphereCurve
		{
			key = 0 300
			key = 1 110
			key = 4 0.001
		}
	}
}

