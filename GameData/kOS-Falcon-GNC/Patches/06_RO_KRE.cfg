// ============================================================================
// SECTION 3: COLD GAS THRUSTERS & BOOSTER WINGS
// ============================================================================

@PART[HotGasThruster-M]:FOR[RealismOverhaul]:HAS[~RSSROConfig[True]]:NEEDS[RealismOverhaul,KerbalReusabilityExpansion]
{
	%RSSROConfig = True
	%kOSFalconGNC_BaseRO = True
	%rescaleFactor = 1.036

	@title = Booster Cold Gas Thruster Pod (Medium)
	@manufacturer = SpaceX
	@mass = 0.04
	@crashTolerance = 12
	%breakingForce = 250
	%breakingTorque = 250
	%skinTempTag = Titanium
	%internalTempTag = Instruments

	!MODULE[ModuleFuelTanks],* {}

	@MODULE[ModuleRCSFX]
	{
		@thrusterPower = 6.0
		!resourceName = DELETE
		!PROPELLANT,* {}
		PROPELLANT
		{
			name = Nitrogen
			ratio = 1.0
			resourceFlowMode = STAGE_PRIORITY_FLOW
		}
		!atmosphereCurve {}
		atmosphereCurve
		{
			key = 0 240
			key = 1 140
			key = 5 0.001
		}
	}

	MODULE
	{
		name = ModuleFuelTanks
		type = ServiceModule
		volume = 600
		basemass = -1
		TANK
		{
			name = Nitrogen
			amount = 240000
			maxAmount = 240000
		}
	}
}

