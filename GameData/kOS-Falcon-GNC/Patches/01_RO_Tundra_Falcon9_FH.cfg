// ============================================================================
// kOS-Falcon-GNC - Clean-Room Realism Overhaul Patches for Tundra Exploration
// Subsystem: Falcon 9 (Block 4 / Block 5), Falcon Heavy, Rideshare Adapters
// License:   MIT (Decal textures derived from nessux/TundraExploration4RO, MIT)
// Sources:   SpaceX Falcon User's Guide (Rev. Mar 2025), Wikipedia Falcon 9 /
//            Falcon Heavy technical tables, official RO Merlin1_Config.cfg,
//            and kOS-Falcon-GNC flight-calibrated hardware profile.
//
// Layer 1 Design:
//   All base RO conversion blocks are guarded by :HAS[~RSSROConfig[True]] so
//   they never collide with any third-party RO patch pack a user may install.
//   Follow-up :AFTER[RealismOverhaulEngines] blocks check #kOSFalconGNC_BaseRO.
// ============================================================================

// ----------------------------------------------------------------------------
// TE_19_F9_S1_Tank : Falcon 9 / Falcon Heavy First Stage Propellant Tank
// Real: 3.66 m dia (~3.70 m at 1.48x), ~411 t subcooled RP-1/LOX (~397.16 kL)
// GNC Parity: mass = 5.66 t, Cryogenic volume = 397159.68 L
// ----------------------------------------------------------------------------
@PART[TE_19_F9_S1_Tank]:FOR[RealismOverhaul]:HAS[~RSSROConfig[True]]:NEEDS[RealismOverhaul,TundraExploration]
{
	%RSSROConfig = True
	%kOSFalconGNC_BaseRO = True
	%rescaleFactor = 1.48

	@title = Falcon 9 / Heavy First Stage Tank
	@manufacturer = SpaceX
	@description = Full-scale 3.66 m aluminum-lithium alloy first-stage propellant tank for Falcon 9 Block 4/5 and Falcon Heavy cores, sized for ~411 t of densified subcooled RP-1 and liquid oxygen.

	@mass = 5.66
	@crashTolerance = 12
	%breakingForce = 250
	%breakingTorque = 250
	%skinTempTag = Aluminum
	%internalTempTag = Instruments

	!RESOURCE[*],* {}
	!MODULE[ModuleFuelTanks],* {}

	MODULE
	{
		name = ModuleFuelTanks
		type = Cryogenic
		volume = 397159.68
		basemass = -1
	}

	@MODULE[ModuleTundraSoot]
	{
		@Flag1TexturePath = kOS-Falcon-GNC/Textures/dds/TE_23_F9_Decals_2
		@Flag2TexturePath = kOS-Falcon-GNC/Textures/dds/TE_23_F9_Decals_1
		@Flag3TexturePath = kOS-Falcon-GNC/Textures/png/US_FLAG

		@FLAG,0
		{
			@guiName = SpaceX Logo
		}
		@FLAG,1
		{
			@guiName = Vertical Logo
		}
		@FLAG,2
		{
			@guiName = US Flag
		}
	}
}

