// ----------------------------------------------------------------------------
// TE_19_F9_S1_Octaweb : Empty Octaweb Thrust Structure (for modular 9x M1D)
// Mass = 6.32 t (cluster) - 9 x 0.47 t (Merlin 1D) = 2.09 t
// ----------------------------------------------------------------------------
@PART[TE_19_F9_S1_Octaweb]:FOR[RealismOverhaul]:HAS[~RSSROConfig[True]]:NEEDS[RealismOverhaul,TundraExploration]
{
	%RSSROConfig = True
	%kOSFalconGNC_BaseRO = True
	%rescaleFactor = 1.48

	@title = Falcon 9 / Heavy Empty Octaweb Structure
	@manufacturer = SpaceX
	@description = Standalone Falcon 9 Octaweb thrust frame with titanium thermal shielding, ready for individually mounted Merlin 1D engines.

	@mass = 2.09
	@crashTolerance = 12
	%breakingForce = 250
	%breakingTorque = 250
	%skinTempTag = Titanium
	%internalTempTag = HotStructure
}

// ----------------------------------------------------------------------------
// TE2_19_F9_Merlin_1D : Individual Sea-Level Merlin 1D Engine
// Uses official RO Merlin1_Config.cfg (Merlin1D / 1D+ / 1D++, 470 kg each)
// ----------------------------------------------------------------------------
@PART[TE2_19_F9_Merlin_1D]:FOR[RealismOverhaul]:HAS[~RSSROConfig[True]]:NEEDS[RealismOverhaul,TundraExploration]
{
	%RSSROConfig = True
	%kOSFalconGNC_BaseRO = True
	%rescaleFactor = 1.48
	%engineType = Merlin1

	@title = Merlin 1D Sea-Level Engine
	@manufacturer = SpaceX
	@description = Individual SpaceX Merlin 1D gas-generator kerolox engine (845 kN SL / 914 kN Vac in Block 5 configuration).

	%breakingForce = 250
	%breakingTorque = 250

	!RESOURCE[ElectricCharge] {}
	!MODULE[ModuleAlternator],* {}

	@MODULE[ModuleGimbal]
	{
		@gimbalRange = 5.0
		%useGimbalResponseSpeed = True
		%gimbalResponseSpeed = 16
	}
}

@PART[TE2_19_F9_Merlin_1D]:AFTER[RealismOverhaulEngines]:HAS[#kOSFalconGNC_BaseRO[True]]:NEEDS[RealismOverhaul,TundraExploration]
{
	@MODULE[ModuleEngineConfigs]
	{
		@configuration = Merlin1D++
		!CONFIG[Merlin1A] {}
		!CONFIG[Merlin1B] {}
		!CONFIG[Merlin1BVac] {}
		!CONFIG[Merlin1C] {}
		!CONFIG[Merlin1CVac] {}
		!CONFIG[Merlin1DVac] {}
		!CONFIG[Merlin1DVac+] {}
	}
}

// ----------------------------------------------------------------------------
// TE_19_F9_S1_Interstage : Falcon 9 / Heavy Composite Interstage & Avionics
// GNC Parity: mass = 1.0 t, EC = 10000, ejectionForce = 9500, UHF RealAntenna
// ----------------------------------------------------------------------------
@PART[TE_19_F9_S1_Interstage]:FOR[RealismOverhaul]:HAS[~RSSROConfig[True]]:NEEDS[RealismOverhaul,TundraExploration]
{
	%RSSROConfig = True
	%kOSFalconGNC_BaseRO = True
	%rescaleFactor = 1.48

	@title = Falcon 9 / Heavy Composite Interstage
	@manufacturer = SpaceX
	@description = Carbon-fiber composite interstage housing the first-stage guidance computer, UHF telemetry transceiver, grid-fin actuation mounts, and pneumatic stage-separation pusher.

	@mass = 1.0
	@crashTolerance = 12
	%breakingForce = 250
	%breakingTorque = 250
	%skinTempTag = Aluminum
	%internalTempTag = Instruments

	!MODULE[ModuleReactionWheel],* {}

	@MODULE[ModuleCommand]
	{
		@RESOURCE[ElectricCharge]
		{
			@rate = 0.5
		}
	}

	@RESOURCE[ElectricCharge]
	{
		@amount = 10000
		@maxAmount = 10000
	}

	@MODULE[ModuleTundraDecoupler]
	{
		@ejectionForce = 9500
	}

	!MODULE[ModuleDataTransmitter]:NEEDS[RealAntennas] {}
	MODULE:NEEDS[RealAntennas]
	{
		name = ModuleRealAntenna
		referenceGain = 1.5
		RFBand = UHF
	}

	@MODULE[ModuleTundraSoot]
	{
		@Flag1TexturePath = kOS-Falcon-GNC/Textures/dds/TE_23_F9_Decals_2
		@Flag2TexturePath = kOS-Falcon-GNC/Textures/dds/TE_23_F9_Decals_3
		@Flag3TexturePath = kOS-Falcon-GNC/Textures/png/US_FLAG

		@FLAG,0
		{
			@guiName = F9 Logo
		}
		@FLAG,1
		{
			@guiName = FH Logo
		}
		@FLAG,2
		{
			@guiName = US Flag
		}
	}
}

// ----------------------------------------------------------------------------
// TE2_19_F9_CGT : Falcon 9 First Stage Nitrogen Cold Gas Thruster Pod
// GNC Parity: mass = 0.0345 t, thrusterPower = 10 kN, Nitrogen 400 kL in
//             1000 L ServiceModule tank, clean monotonic Isp curve (240/140 s)
// ----------------------------------------------------------------------------
@PART[TE2_19_F9_CGT]:FOR[RealismOverhaul]:HAS[~RSSROConfig[True]]:NEEDS[RealismOverhaul,TundraExploration]
{
	%RSSROConfig = True
	%kOSFalconGNC_BaseRO = True
	%rescaleFactor = 1.48

	@title = Falcon 9 Cold Gas Thruster Pod
	@manufacturer = SpaceX
	@description = High-pressure nitrogen cold-gas attitude control pod mounted at the top of the Falcon 9 / Heavy first stage for exoatmospheric flip maneuvers and propellant ullage settling.

	@mass = 0.0345
	@crashTolerance = 12
	%breakingForce = 250
	%breakingTorque = 250
	%skinTempTag = Titanium
	%internalTempTag = Instruments

	// Strip stock CryoTanks/RationalResources RCS fuel switcher if present
	!MODULE[ModuleB9PartSwitch]:HAS[#moduleID[RCS]] {}
	!MODULE[ModuleFuelTanks],* {}

	@MODULE[ModuleRCSFX]
	{
		@thrusterPower = 10.0
		!resourceName = DELETE
		!PROPELLANT,* {}
		PROPELLANT
		{
			name = Nitrogen
			ratio = 1.0
			resourceFlowMode = STAGE_PRIORITY_FLOW
		}
		!atmosphereCurve {}
		atmosphereCurve
		{
			key = 0 240
			key = 1 140
			key = 5 0.001
		}
	}

	MODULE
	{
		name = ModuleFuelTanks
		type = ServiceModule
		volume = 1000
		basemass = -1
		TANK
		{
			name = Nitrogen
			amount = 400000
			maxAmount = 400000
		}
	}
}

// ----------------------------------------------------------------------------
// TE_19_F9_S2_Tank : Falcon 9 / Heavy Second Stage Tank
// Real: ~92.7-107.5 t subcooled RP-1/LOX, ~3.9-4.0 t total S2 dry mass
// GNC Parity: mass = 3.0 t, Cryogenic volume = 101325 L (~104.9 t propellant)
// B9PS NODE positions scaled by 1.48x to match rescaleFactor
// ----------------------------------------------------------------------------
@PART[TE_19_F9_S2_Tank]:FOR[RealismOverhaul]:HAS[~RSSROConfig[True]]:NEEDS[RealismOverhaul,TundraExploration]
{
	%RSSROConfig = True
	%kOSFalconGNC_BaseRO = True
	%rescaleFactor = 1.48

	@title = Falcon 9 / Heavy Second Stage Tank
	@manufacturer = SpaceX
	@description = Full-scale 3.66 m upper-stage aluminum-lithium propellant tank for Falcon 9 Full Thrust / Block 5 and Falcon Heavy, sized for ~105 t of densified RP-1 and liquid oxygen.

	@mass = 3.0
	@crashTolerance = 12
	%breakingForce = 250
	%breakingTorque = 250
	%skinTempTag = Aluminum
	%internalTempTag = Instruments

	!RESOURCE[*],* {}
	!MODULE[ModuleFuelTanks],* {}

	MODULE
	{
		name = ModuleFuelTanks
		type = Cryogenic
		volume = 101325
		basemass = -1
	}

	// B9PartSwitch NODE positions compensate for rescaleFactor = 1.48 (stock / 1.48)
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[capSwitch1]]
	{
		@SUBTYPE[Cap2]
		{
			@NODE[node_top]
			{
				@position = 0, 1.97261486, 0
			}
		}
	}

	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[capSwitch2]]
	{
		@SUBTYPE[Cap4]
		{
			@NODE[node_down]
			{
				@position = 0, -1.83347297, 0
			}
		}
	}
}

