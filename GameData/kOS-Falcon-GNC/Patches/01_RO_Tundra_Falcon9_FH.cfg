// TE_19_F9_S2_Engine : Merlin 1D Vacuum Engine (Standard & Short Nozzle)
// Uses official RO Merlin1_Config.cfg (Merlin1DVac 805 kN / 345 s,
// Merlin1DVac+ 934.12 kN / 348 s) + Short-Nozzle variant (338 s, 5 ignitions)
// ----------------------------------------------------------------------------
@PART[TE_19_F9_S2_Engine]:FOR[RealismOverhaul]:HAS[~RSSROConfig[True]]:NEEDS[RealismOverhaul,TundraExploration]
{
	%RSSROConfig = True
	%kOSFalconGNC_BaseRO = True
	%rescaleFactor = 1.48
	%engineType = Merlin1

	@title = Merlin 1D Vacuum Engine
	@manufacturer = SpaceX
	@description = Radiatively cooled niobium-alloy vacuum variant of the Merlin 1D engine powering the Falcon 9 / Heavy upper stage. Supports standard long nozzle (348 s Vac) and short nozzle (338 s Vac, 5 ignitions).

	%breakingForce = 250
	%breakingTorque = 250

	!RESOURCE[ElectricCharge] {}
	!MODULE[ModuleAlternator],* {}

	@MODULE[ModuleGimbal]
	{
		@gimbalRange = 5.0
		%useGimbalResponseSpeed = True
		%gimbalResponseSpeed = 16
	}

	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[TE_Dome]]
	{
		@SUBTYPE[Dome2]
		{
			@NODE[node_top]
			{
				@position = 0, 0.46317568, 0
			}
		}
	}

	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[TE_MVAC]]
	{
		@SUBTYPE[MVAC_1]
		{
			@title = Standard MVac Nozzle
			@descriptionDetail = Standard high-expansion niobium nozzle (348 s Vac Isp).
		}
		@SUBTYPE[MVAC_2]
		{
			@title = Short MVac Nozzle
			@addedMass = 0
			@addedCost = 0
			@descriptionDetail = Shortened lower-mass nozzle (338 s Vac Isp, 5 ignitions).
			!MODULE:HAS[@IDENTIFIER:HAS[#name[ModuleEnginesFX]]] {}
			!MODULE:HAS[@IDENTIFIER:HAS[#name[ModuleAlternator]]] {}
			@TRANSFORM[thrustTransform]
			{
				@positionOffset = 0, 0, -0.481081
			}
		}
	}
}

@PART[TE_19_F9_S2_Engine]:AFTER[RealismOverhaulEngines]:HAS[#kOSFalconGNC_BaseRO[True]]:NEEDS[RealismOverhaul,TundraExploration]
{
	@MODULE[ModuleEngineConfigs]
	{
		@configuration = Merlin1DVac+

		!CONFIG[Merlin1A] {}
		!CONFIG[Merlin1B] {}
		!CONFIG[Merlin1BVac] {}
		!CONFIG[Merlin1C] {}
		!CONFIG[Merlin1CVac] {}
		!CONFIG[Merlin1D] {}
		!CONFIG[Merlin1D+] {}
		!CONFIG[Merlin1D++] {}

		@CONFIG[Merlin1DVac]
		{
			%subtype = MVAC_1
		}

		@CONFIG[Merlin1DVac+]
		{
			%subtype = MVAC_1
		}

		+CONFIG[Merlin1DVac+]
		{
			@name = Merlin1DVac+_Short_Nozzle
			@description = Short-nozzle Merlin 1D Vacuum optimized for high-cadence LEO missions (338 s Vac Isp, 5 ignitions).
			@massMult = 0.58
			@ignitions = 5
			%subtype = MVAC_2
			@atmosphereCurve
			{
				@key,0 = 0 338
			}
		}
	}

	@RESOURCE[TEATEB]
	{
		@amount = 5.0
		@maxAmount = 5.0
	}
}

// ----------------------------------------------------------------------------
// TE_F9_S2_RCS : Falcon 9 Second Stage Nitrogen Cold Gas Attitude Control
// GNC Parity: mass = 0.01 t, 1.0 kN, 300/180 s, 60 L ServiceModule (12 kL N2)
// ----------------------------------------------------------------------------
@PART[TE_F9_S2_RCS]:FOR[RealismOverhaul]:HAS[~RSSROConfig[True]]:NEEDS[RealismOverhaul,TundraExploration]
{
	%RSSROConfig = True
	%kOSFalconGNC_BaseRO = True
	%rescaleFactor = 1.48

	@title = Falcon 9 Second Stage RCS Thruster
	@manufacturer = SpaceX
	@description = Compact nitrogen cold-gas attitude control thruster block mounted on the Falcon 9 / Heavy upper stage for coast-phase pointing, ullage settling, and payload deployment.

	@mass = 0.01
	@crashTolerance = 12
	%breakingForce = 250
	%breakingTorque = 250
	%skinTempTag = Titanium
	%internalTempTag = Instruments

	!MODULE[ModuleFuelTanks],* {}

	@MODULE[ModuleRCSFX]
	{
		@thrusterPower = 1.0
		!resourceName = DELETE
		!PROPELLANT,* {}
		PROPELLANT
		{
			name = Nitrogen
			ratio = 1.0
			resourceFlowMode = STAGE_PRIORITY_FLOW
		}
		!atmosphereCurve {}
		atmosphereCurve
		{
			key = 0 300
			key = 1 180
		}
	}

	MODULE
	{
		name = ModuleFuelTanks
		type = ServiceModule
		volume = 60
		basemass = -1
		TANK
		{
			name = Nitrogen
			amount = 12000
			maxAmount = 12000
		}
	}
}

