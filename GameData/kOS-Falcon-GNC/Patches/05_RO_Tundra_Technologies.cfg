// ============================================================================
// kOS-Falcon-GNC - Clean-Room Realism Overhaul Patches for TundraTechnologies
// Subsystem: Haven-1 Commercial Station (Gaira) & SmallSat / Deep-Space Buses
//            (Iridium NEXT, New Horizons, Starlink Antenna)
// License:   MIT
// Note:      Guarded by :NEEDS[RealismOverhaul,TundraTechnologies] so it has
//            zero effect if TundraTechnologies is not installed.
// ============================================================================

// ============================================================================
// SECTION 1: HAVEN-1 COMMERCIAL SPACE STATION (Gaira, 4.4 m dia -> 1.48x)
// Vast Haven-1: ~14 t launch mass on Falcon 9, 4 crew, ~13 kW solar arrays
// ============================================================================

@PART[TT_G1_BASE]:FOR[RealismOverhaul]:HAS[~RSSROConfig[True]]:NEEDS[RealismOverhaul,TundraTechnologies]
{
	%RSSROConfig = True
	%kOSFalconGNC_BaseRO = True
	%rescaleFactor = 1.48

	@title = Haven-1 Main Habitat Module
	@manufacturer = Vast
	@description = Commercial low-Earth-orbit habitable station module launched aboard Falcon 9, supporting four visiting crew members with life support, avionics, and thermal control.

	@mass = 7.5
	@CrewCapacity = 4
	@crashTolerance = 12
	%breakingForce = 250
	%breakingTorque = 250
	%skinTempTag = MLI
	%internalTempTag = Instruments

	!RESOURCE[*],* {}
	!MODULE[ModuleFuelTanks],* {}

	@MODULE[ModuleCommand]
	{
		%RESOURCE[ElectricCharge]
		{
			%rate = 2.0
		}
	}

	@MODULE[ModuleActiveRadiator]
	{
		@maxEnergyTransfer = 300
		@RESOURCE[ElectricCharge]
		{
			@rate = 0.1
		}
	}

	MODULE
	{
		name = ModuleFuelTanks
		type = ServiceModule
		volume = 3000
		basemass = -1
		TANK
		{
			name = ElectricCharge
			amount = 144000
			maxAmount = 144000
		}
		TANK
		{
			name = Hydrazine
			amount = 800
			maxAmount = 800
		}
	}

	!MODULE[ModuleDataTransmitter]:NEEDS[RealAntennas] {}
	MODULE:NEEDS[RealAntennas]
	{
		name = ModuleRealAntenna
		referenceGain = 2.0
		RFBand = S
	}
}

