@PART[TT_G1_RCS|TT_G1_Thuster]:FOR[RealismOverhaul]:HAS[~RSSROConfig[True]]:NEEDS[RealismOverhaul,TundraTechnologies]
{
	%RSSROConfig = True
	%kOSFalconGNC_BaseRO = True
	%rescaleFactor = 1.48

	@manufacturer = Vast
	@mass = 0.06
	@crashTolerance = 12
	%breakingForce = 250
	%breakingTorque = 250
	%skinTempTag = Titanium
	%internalTempTag = Instruments

	@MODULE[ModuleRCSFX]
	{
		@thrusterPower = 0.2
		!resourceName = DELETE
		!PROPELLANT,* {}
		PROPELLANT
		{
			name = Hydrazine
			ratio = 1.0
			resourceFlowMode = STAGE_PRIORITY_FLOW
		}
		!atmosphereCurve {}
		atmosphereCurve
		{
			key = 0 230
			key = 1 80
		}
	}
}

