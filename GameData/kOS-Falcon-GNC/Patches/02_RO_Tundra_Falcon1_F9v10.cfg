// ============================================================================
// kOS-Falcon-GNC - Clean-Room Realism Overhaul Patches for Tundra Exploration
// Subsystem: Falcon 1 (Mothra) & Falcon 9 v1.0 (Bagorah 9)
// License:   MIT (Decal textures derived from nessux/TundraExploration4RO, MIT)
// Sources:   Wikipedia Falcon 1 & Falcon 9 v1.0 technical specs, official RO
//            Merlin1_Config.cfg and Kestrel_Config.cfg.
// ============================================================================

// ============================================================================
// SECTION 1: FALCON 1 (1.68 m diameter -> 1.344x stock 1.25 m scale)
// GLOM ~28-38 t: S1 ~21.3 t RP-1/LOX + 1x Merlin 1A/1C,
//                S2 ~4.0 t RP-1/LOX + 1x Kestrel (30.5-30.7 kN, 317-320 s)
// ============================================================================

@PART[TE_F1_S1_Tank]:FOR[RealismOverhaul]:HAS[~RSSROConfig[True]]:NEEDS[RealismOverhaul,TundraExploration]
{
	%RSSROConfig = True
	%kOSFalconGNC_BaseRO = True
	%rescaleFactor = 1.344

	@title = Falcon 1 First Stage Tank
	@manufacturer = SpaceX
	@description = Full-scale 1.68 m aluminum-alloy first-stage tank for Falcon 1, holding ~21.3 t of RP-1 and liquid oxygen.

	@mass = 0.90
	@crashTolerance = 12
	%breakingForce = 250
	%breakingTorque = 250
	%skinTempTag = Aluminum
	%internalTempTag = Instruments

	!RESOURCE[*],* {}
	!MODULE[ModuleFuelTanks],* {}

	MODULE
	{
		name = ModuleFuelTanks
		type = Cryogenic
		volume = 20900
		basemass = -1
	}

	@MODEL
	{
		texture = TE_19_F9_Decals, kOS-Falcon-GNC/Textures/dds/TE_19_F9_Decals
	}
}

@PART[TE_F1_S1_Engine]:FOR[RealismOverhaul]:HAS[~RSSROConfig[True]]:NEEDS[RealismOverhaul,TundraExploration]
{
	%RSSROConfig = True
	%kOSFalconGNC_BaseRO = True
	%rescaleFactor = 1.344
	%engineType = Merlin1

	@title = Merlin 1A / 1C First Stage Engine (Falcon 1)
	@manufacturer = SpaceX
	@description = Early Falcon 1 sea-level Merlin engine, configurable from the ablatively cooled Merlin 1A (Flights 1-2) to the regeneratively cooled Merlin 1C (Flights 3-5).

	%breakingForce = 250
	%breakingTorque = 250

	!RESOURCE[ElectricCharge] {}
	!MODULE[ModuleAlternator],* {}

	@MODULE[ModuleGimbal]
	{
		@gimbalRange = 6.0
		%useGimbalResponseSpeed = True
		%gimbalResponseSpeed = 16
	}
}

@PART[TE_F1_S1_Engine]:AFTER[RealismOverhaulEngines]:HAS[#kOSFalconGNC_BaseRO[True]]:NEEDS[RealismOverhaul,TundraExploration]
{
	@MODULE[ModuleEngineConfigs]
	{
		@configuration = Merlin1C
		!CONFIG[Merlin1BVac] {}
		!CONFIG[Merlin1CVac] {}
		!CONFIG[Merlin1D] {}
		!CONFIG[Merlin1D+] {}
		!CONFIG[Merlin1D++] {}
		!CONFIG[Merlin1DVac] {}
		!CONFIG[Merlin1DVac+] {}
	}
}

@PART[TE_F1_Interstage]:FOR[RealismOverhaul]:HAS[~RSSROConfig[True]]:NEEDS[RealismOverhaul,TundraExploration]
{
	%RSSROConfig = True
	%kOSFalconGNC_BaseRO = True
	%rescaleFactor = 1.344

	@title = Falcon 1 Interstage
	@manufacturer = SpaceX
	@description = Structural 1.68 m interstage and pneumatic separation collar connecting the Falcon 1 first and second stages.

	@mass = 0.12
	@crashTolerance = 12
	%breakingForce = 250
	%breakingTorque = 250
	%skinTempTag = Aluminum
	%internalTempTag = Instruments
}

@PART[TE_F1_S2_Tank]:FOR[RealismOverhaul]:HAS[~RSSROConfig[True]]:NEEDS[RealismOverhaul,TundraExploration]
{
	%RSSROConfig = True
	%kOSFalconGNC_BaseRO = True
	%rescaleFactor = 1.344

	@title = Falcon 1 Second Stage Tank
	@manufacturer = SpaceX
	@description = Pressure-fed 1.68 m aluminum-lithium upper-stage tank for Falcon 1, holding ~4.0 t of RP-1, liquid oxygen, and helium pressurant.

	@mass = 0.42
	@crashTolerance = 12
	%breakingForce = 250
	%breakingTorque = 250
	%skinTempTag = Aluminum
	%internalTempTag = Instruments

	!RESOURCE[*],* {}
	!MODULE[ModuleFuelTanks],* {}

	MODULE
	{
		name = ModuleFuelTanks
		type = Tank-Sep-Stirred-HP
		volume = 4150
		basemass = -1
	}
}

@PART[TE_F1_S2_Engine]:FOR[RealismOverhaul]:HAS[~RSSROConfig[True]]:NEEDS[RealismOverhaul,TundraExploration]
{
	%RSSROConfig = True
	%kOSFalconGNC_BaseRO = True
	%rescaleFactor = 1.344
	%engineType = Kestrel

	@title = Kestrel Upper Stage Engine
	@manufacturer = SpaceX
	@description = Pressure-fed ablatively cooled kerolox vacuum engine with a radiatively cooled niobium nozzle extension and cold-gas helium roll-control thrusters.

	%breakingForce = 250
	%breakingTorque = 250

	!RESOURCE[ElectricCharge] {}
	!RESOURCE[MonoPropellant] {}
	!MODULE[ModuleAlternator],* {}

	@MODULE[ModuleGimbal]
	{
		@gimbalRange = 4.0
		%useGimbalResponseSpeed = True
		%gimbalResponseSpeed = 16
	}

	@MODULE[ModuleRCSFX]
	{
		@thrusterPower = 0.08
		!resourceName = DELETE
		!PROPELLANT,* {}
		PROPELLANT
		{
			name = Helium
			ratio = 1.0
			resourceFlowMode = STAGE_PRIORITY_FLOW
		}
		!atmosphereCurve {}
		atmosphereCurve
		{
			key = 0 165
			key = 1 55
		}
	}
}

@PART[TE_F1_PayloadFairing]:FOR[RealismOverhaul]:HAS[~RSSROConfig[True]]:NEEDS[RealismOverhaul,TundraExploration]
{
	%RSSROConfig = True
	%kOSFalconGNC_BaseRO = True
	%rescaleFactor = 1.344

	@title = Falcon 1 Avionics & Payload Adapter
	@manufacturer = SpaceX
	@description = Falcon 1 upper-stage avionics bay, payload attach ring, battery pack, and UHF telemetry unit.

	@mass = 0.08
	@crashTolerance = 12
	%breakingForce = 250
	%breakingTorque = 250
	%skinTempTag = Aluminum
	%internalTempTag = Instruments

	!MODULE[ModuleReactionWheel],* {}

	@MODULE[ModuleCommand]
	{
		@RESOURCE[ElectricCharge]
		{
			@rate = 0.15
		}
	}

	@RESOURCE[ElectricCharge]
	{
		@amount = 3600
		@maxAmount = 3600
	}

	!MODULE[ModuleDataTransmitter]:NEEDS[RealAntennas] {}
	MODULE:NEEDS[RealAntennas]
	{
		name = ModuleRealAntenna
		referenceGain = 1.5
		RFBand = UHF
	}
}

@PART[TE_21_F1_Fairing_Half]:FOR[RealismOverhaul]:HAS[~RSSROConfig[True]]:NEEDS[RealismOverhaul,TundraExploration]
{
	%RSSROConfig = True
	%kOSFalconGNC_BaseRO = True
	%rescaleFactor = 1.344

	@title = Falcon 1 Payload Fairing Half
	@manufacturer = SpaceX
	@description = Lightweight 1.68 m composite payload fairing half for Falcon 1.

	@mass = 0.06
	@crashTolerance = 12
	%breakingForce = 250
	%breakingTorque = 250
	%skinTempTag = Inconel
	%internalTempTag = Instruments
}

