// ============================================================================
// kOS-Falcon-GNC - Layer 2 GNC Calibration Parity & FAR Aerodynamic Overrides
// License:   MIT
//
// Purpose:
//   Guarantees exact flight-calibrated hardware parity for kOS-Falcon-GNC
//   even when third-party RO patch packs are also installed.
//
// Pass Ordering:
//   1. :BEFORE[FerramAerospaceResearch]
//      Converts KRE "Grid Fin M Titanium" from stock ModuleControlSurface to
//      FARControllableSurface so FAR runs its :FOR pass cleanly and skips
//      redundant FARPartModule in :AFTER.
//   2. :AFTER[RealismOverhaul] & :AFTER[RealismOverhaulEnginesPost]
//      Enforces GNC-calibrated gimbal (5 deg), ignitions/TEATEB (5), interstage
//      separation force (9500), S1 CGT / S2 RCS thrust & tank capacity, and UHF
//      RealAntennas (guaranteed to run before :FOR[zRealAntennas]).
//   3. :LAST[kOS-Falcon-GNC]
//      Cleans up the internal Layer 1 marker key.
// ============================================================================

// ----------------------------------------------------------------------------
// 1. KRE Medium Titanium Grid Fin -> FARControllableSurface
//    Part name in KRE contains spaces: "Grid Fin M Titanium"
//    Matched safely via single-char wildcards: Grid?Fin?M?Titanium
// ----------------------------------------------------------------------------
@PART[Grid?Fin?M?Titanium]:BEFORE[FerramAerospaceResearch]:NEEDS[FerramAerospaceResearch,KerbalReusabilityExpansion]
{
	!MODULE[ModuleControlSurface],* {}
	!MODULE[FARControllableSurface],* {}

	MODULE
	{
		name = FARControllableSurface
		b_2 = 1.65
		MAC = 1.25
		TaperRatio = 1.0
		MidChordSweep = 0.0
		nonSideAttach = 0
		maxdeflect = 25.0
		ctrlSurfFrac = 1.0
		transformName = Pivot
		pitchaxis = -100.0
		yawaxis = -100.0
		rollaxis = 0.0
	}
}

// ----------------------------------------------------------------------------
// 2. Stage 1 Engine Cluster (TE_19_F9_S1_Engine) GNC Calibration Guarantees
//    - 5 deg gimbal range on both gimbal modules for hoverslam control authority
//    - 5 ignitions + 5 TEATEB across AllEngines / ThreeLanding / CenterOnly
// ----------------------------------------------------------------------------
@PART[TE_19_F9_S1_Engine]:AFTER[RealismOverhaulEnginesPost]:NEEDS[RealismOverhaul,TundraExploration]
{
	@MODULE[ModuleGimbal],*
	{
		@gimbalRange = 5.0
	}

	@MODULE[ModuleEngineConfigs],*
	{
		@CONFIG,*
		{
			%ignitions = 5
		}
	}

	@RESOURCE[TEATEB]
	{
		@amount = 5.0
		@maxAmount = 5.0
	}
}

// ----------------------------------------------------------------------------
// 3. Stage 1 Interstage (TE_19_F9_S1_Interstage) Separation & UHF Telemetry
// ----------------------------------------------------------------------------
@PART[TE_19_F9_S1_Interstage]:AFTER[RealismOverhaul]:NEEDS[RealismOverhaul,TundraExploration]
{
	@MODULE[ModuleTundraDecoupler]
	{
		@ejectionForce = 9500
	}

	@RESOURCE[ElectricCharge]
	{
		@amount = 10000
		@maxAmount = 10000
	}

	!MODULE[ModuleDataTransmitter]:NEEDS[RealAntennas] {}
	!MODULE[ModuleRealAntenna]:NEEDS[RealAntennas],* {}
	MODULE:NEEDS[RealAntennas]
	{
		name = ModuleRealAntenna
		referenceGain = 1.5
		RFBand = UHF
	}
}

// ----------------------------------------------------------------------------
// 4. Stage 1 Cold Gas Thruster Pod (TE2_19_F9_CGT) Flip & Ullage Authority
// ----------------------------------------------------------------------------
@PART[TE2_19_F9_CGT]:AFTER[RealismOverhaul]:NEEDS[RealismOverhaul,TundraExploration]
{
	@MODULE[ModuleRCSFX]
	{
		@thrusterPower = 10.0
		!resourceName = DELETE
		!PROPELLANT,* {}
		PROPELLANT
		{
			name = Nitrogen
			ratio = 1.0
			resourceFlowMode = STAGE_PRIORITY_FLOW
		}
		!atmosphereCurve {}
		atmosphereCurve
		{
			key = 0 240
			key = 1 140
			key = 5 0.001
		}
	}

	!MODULE[ModuleFuelTanks],* {}
	MODULE
	{
		name = ModuleFuelTanks
		type = ServiceModule
		volume = 1000
		basemass = -1
		TANK
		{
			name = Nitrogen
			amount = 400000
			maxAmount = 400000
		}
	}
}

// ----------------------------------------------------------------------------
// 5. Stage 2 RCS (TE_F9_S2_RCS) Coast Pointing & Ullage Authority
// ----------------------------------------------------------------------------
@PART[TE_F9_S2_RCS]:AFTER[RealismOverhaul]:NEEDS[RealismOverhaul,TundraExploration]
{
	@MODULE[ModuleRCSFX]
	{
		@thrusterPower = 1.0
		!resourceName = DELETE
		!PROPELLANT,* {}
		PROPELLANT
		{
			name = Nitrogen
			ratio = 1.0
			resourceFlowMode = STAGE_PRIORITY_FLOW
		}
		!atmosphereCurve {}
		atmosphereCurve
		{
			key = 0 300
			key = 1 180
		}
	}

	!MODULE[ModuleFuelTanks],* {}
	MODULE
	{
		name = ModuleFuelTanks
		type = ServiceModule
		volume = 60
		basemass = -1
		TANK
		{
			name = Nitrogen
			amount = 12000
			maxAmount = 12000
		}
	}
}

// ----------------------------------------------------------------------------
// 6. Clean up internal Layer 1 marker tag
// ----------------------------------------------------------------------------
@PART[*]:HAS[#kOSFalconGNC_BaseRO[True]]:LAST[kOS-Falcon-GNC]
{
	!kOSFalconGNC_BaseRO = DELETE
}
