@PART[TE_Ghidorah_Erector|TE_Ghidorah_Erector_2|TE_Ghidorah_Erector_3]:FOR[RealismOverhaul]:HAS[~RSSROConfig[True]]:NEEDS[RealismOverhaul,TundraExploration]
{
	%RSSROConfig = True
	%kOSFalconGNC_BaseRO = True
	%rescaleFactor = 1.48

	@manufacturer = SpaceX
	@mass = 1000
	@crashTolerance = 12
	%breakingForce = 250
	%breakingTorque = 250
	%maxTemp = 1073.15
	%skinMaxTemp = 1073.15

	@MODULE[ModuleGenerator]
	{
		@isAlwaysActive = True
		%requiresAllInputs = False
		!OUTPUT_RESOURCE,* {}
		OUTPUT_RESOURCE
		{
			name = ElectricCharge
			rate = 200.0
		}
		OUTPUT_RESOURCE
		{
			name = CooledRP-1
			rate = 100.0
		}
		OUTPUT_RESOURCE
		{
			name = CooledLqdOxygen
			rate = 150.0
		}
		OUTPUT_RESOURCE
		{
			name = RP-1
			rate = 100.0
		}
		OUTPUT_RESOURCE
		{
			name = LqdOxygen
			rate = 150.0
		}
		OUTPUT_RESOURCE
		{
			name = Nitrogen
			rate = 500.0
		}
	}
}

@PART[TE_Ghidorah_Erector]:FOR[RealismOverhaul]:HAS[#kOSFalconGNC_BaseRO[True]]:NEEDS[RealismOverhaul,TundraExploration]
{
	@title = Falcon 9 / Heavy LC-39A Transporter Erector
	@description = Full-scale LC-39A strongback transporter-erector and holddown clamp supporting Falcon 9 and Falcon Heavy with cryogenic boiloff replenishment and ground power.
}

@PART[TE_Ghidorah_Erector_2]:FOR[RealismOverhaul]:HAS[#kOSFalconGNC_BaseRO[True]]:NEEDS[RealismOverhaul,TundraExploration]
{
	@title = Falcon 9 SLC-40 Transporter Erector
	@description = Full-scale SLC-40 strongback transporter-erector and holddown clamp for Falcon 9 with cryogenic boiloff replenishment and ground power.
}

@PART[TE_Ghidorah_Erector_3]:FOR[RealismOverhaul]:HAS[#kOSFalconGNC_BaseRO[True]]:NEEDS[RealismOverhaul,TundraExploration]
{
	@title = Falcon 9 SLC-4E Transporter Erector
	@description = Full-scale Vandenberg SLC-4E strongback transporter-erector and holddown clamp for polar Falcon 9 launches.
}
