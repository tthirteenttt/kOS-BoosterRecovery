// ============================================================================
// kOS-Falcon-GNC - Clean-Room Waterfall Visual Plume Patches (RO Scale)
// Targets:   TundraExploration, TundraTechnologies, KerbalReusabilityExpansion
// License:   MIT
// Requires:  RealismOverhaul + Waterfall
//
// Design:
//   1. TE2_19_F9_CGT (First Stage Nitrogen Cold Gas Thrusters):
//      Re-tunes Tundra's overly bright/opaque white "laser" shader into a soft,
//      translucent, expanding SpaceX-style cold-gas nitrogen mist cone with a
//      smooth proportional throttle ramp.
//   2. Native Tundra / TT Waterfall Parts (MVac, F1, Dragon 2, DXL, S2 RCS,
//      Haven-1): Preserves native custom templates and rescales position/scale
//      proportionally to each part's RO rescaleFactor (1.48x / 1.344x).
//   3. Parts Missing Stock Waterfall (Single M1D, F9 v1.0 MVac, Dragon 1 RCS,
//      KRE SuperDraco & CGT, TT Satellites): Integrates cleanly with RO 17.x's
//      built-in ROWaterfall processor or TE's dragonRCSTemplate.
//   4. TE_19_F9_S1_Engine & TE_19_F910_S1_Engine intentionally retain Tundra's
//      RO-aware 9-engine SmokeScreen TundraPlume (totalRescale = 1.48).
// ============================================================================

// ============================================================================
// SECTION 1: TE2_19_F9_CGT - Soft Translucent SpaceX Cold-Gas Nitrogen Plume
// Runs :AFTER[TundraExplorationWaterfall] (after GhidorahRCS.cfg creates
// HaddockrcsFX) to replace the harsh opaque beam with misty nitrogen expansion.
// ============================================================================
@PART[TE2_19_F9_CGT]:AFTER[TundraExplorationWaterfall]:NEEDS[RealismOverhaul,Waterfall,TundraExploration]
{
	@MODULE[ModuleWaterfallFX]:HAS[#moduleID[HaddockrcsFX]]
	{
		@EFFECT[HaddockrcsPlume]
		{
			@MODEL
			{
				// Keep stock local positionOffset (parent RCS transform already carries 1.48x)
				@scaleOffset = 1.48, -5.2, 1.48

				@MATERIAL
				{
					// Cool translucent nitrogen mist instead of solid opaque white
					@COLOR:HAS[#colorName[_StartTint]]
					{
						@colorValue = 0.88, 0.94, 1.0, 0.72
					}
					@COLOR:HAS[#colorName[_EndTint]]
					{
						@colorValue = 0.80, 0.89, 1.0, 0.25
					}
					// Reduce additive glare (~75% softer than stock 1.73)
					@FLOAT:HAS[#floatName[_Brightness]]
					{
						@value = 0.42
					}
					// Softer axial dissipation, feathered edges, wider expansion cone
					@FLOAT:HAS[#floatName[_Falloff]]
					{
						@value = 2.8
					}
					@FLOAT:HAS[#floatName[_Fresnel]]
					{
						@value = 3.2
					}
					@FLOAT:HAS[#floatName[_FadeOut]]
					{
						@value = 0.65
					}
					@FLOAT:HAS[#floatName[_ExpandLinear]]
					{
						@value = 1.15
					}
				}
			}

			// Smooth proportional throttle response instead of abrupt 0->100% step
			@FLOATMODIFIER[newModifier]
			{
				@combinationType = MULTIPLY
				!floatCurve {}
				floatCurve
				{
					key = 0.0 0.0 0 0
					key = 0.2 0.35 0 0
					key = 1.0 1.0 0 0
				}
			}

			// Natural vacuum plume length (~9.7 m total instead of ~15 m laser needle)
			@SCALEMODIFIER[AtmoScale]
			{
				!yCurve {}
				yCurve
				{
					key = 0.0 4.5 0 0
					key = 0.2 1.2 0 0
					key = 1.0 0.0 0 0
				}
			}

			// Broader feathery expansion cone in upper atmosphere & vacuum
			@FLOATMODIFIER[AtmoExpand]
			{
				!floatCurve {}
				floatCurve
				{
					key = 0.0 2.2 0 0
					key = 0.2 1.5 0 0
					key = 1.0 0.25 0 0
				}
			}
		}
	}
}

// ============================================================================
// SECTION 2: RESCALE NATIVE TUNDRA / TT WATERFALL TEMPLATES TO RO SCALE
// Runs :AFTER[Waterfall] (after TundraExploration / TundraExplorationB /
// TundraTechnologies passes). Only TEMPLATE scale is multiplied by
// rescaleFactor (1.48x / 1.344x); local position offsets are kept unscaled
// because the parent thrustTransform already inherits part rescaleFactor.
// ============================================================================

// Falcon 9 / Heavy Stage 2 Merlin 1D Vacuum (Standard & Short Nozzle B9PS)
@PART[TE_19_F9_S2_Engine]:AFTER[Waterfall]:NEEDS[RealismOverhaul,Waterfall,TundraExploration]
{
	@MODULE[ModuleWaterfallFX]:HAS[#moduleID[MVACFX]]
	{
		@TEMPLATE,*
		{
			@position = 0, 0, 0.305
			@scale[*] *= #$/rescaleFactor$
		}
	}

	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[TE_MVAC]]
	{
		@SUBTYPE[MVAC_2]
		{
			@MODULE:HAS[@IDENTIFIER:HAS[#name[ModuleWaterfallFX]]]
			{
				@DATA
				{
					@TEMPLATE,*
					{
						@scale[*] *= #$/rescaleFactor$
					}
				}
			}
		}
	}
}

// Falcon 9 Stage 2 Cold-Gas RCS
@PART[TE_F9_S2_RCS]:AFTER[Waterfall]:NEEDS[RealismOverhaul,Waterfall,TundraExploration]
{
	@MODULE[ModuleWaterfallFX]:HAS[#moduleID[S2RCSfx]]
	{
		@TEMPLATE,*
		{
			@scale[*] *= #$/rescaleFactor$
		}
	}
}

// Falcon 1 Stage 1 (Merlin 1A/1C) & Stage 2 (Kestrel + Helium Roll RCS)
@PART[TE_F1_S1_Engine|TE_F1_S2_Engine]:AFTER[Waterfall]:NEEDS[RealismOverhaul,Waterfall,TundraExploration]
{
	@MODULE[ModuleWaterfallFX],*
	{
		@TEMPLATE,*
		{
			@scale[*] *= #$/rescaleFactor$
		}
	}
}

// Dragon 2 Crew / Inspiration4 / Cargo (SuperDraco LES + 16x Draco RCS)
@PART[TE_18_DRAGONV2_POD|TE_18_DRAGONV2_POD_I4|TE_20_CargoRodan]:AFTER[Waterfall]:NEEDS[RealismOverhaul,Waterfall,TundraExploration]
{
	@MODULE[ModuleWaterfallFX],*
	{
		@TEMPLATE,*
		{
			@scale[*] *= #$/rescaleFactor$
		}
	}
}

// Dragon XL Docking Nose & External Draco RCS Pods
@PART[TE_21_DXL_Docking|TE_21_DXL_RCS]:AFTER[Waterfall]:NEEDS[RealismOverhaul,Waterfall,TundraExploration]
{
	@MODULE[ModuleWaterfallFX],*
	{
		@TEMPLATE,*
		{
			@scale[*] *= #$/rescaleFactor$
		}
		@EFFECT[nozzle]
		{
			@MODEL
			{
				@scaleOffset[*] *= #$/rescaleFactor$
			}
		}
	}
}

// TundraTechnologies Haven-1 (Gaira) RCS & Boost Thrusters
@PART[TT_G1_RCS|TT_G1_Thuster]:AFTER[Waterfall]:NEEDS[RealismOverhaul,Waterfall,TundraTechnologies]
{
	@MODULE[ModuleWaterfallFX]:HAS[#moduleID[rcs1FX]]
	{
		@TEMPLATE,*
		{
			@scale[*] *= #$/rescaleFactor$
		}
	}
}

// ============================================================================
// SECTION 3: ADD CLEAN RO WATERFALL PLUMES FOR PARTS MISSING STOCK WATERFALL
// Uses RO 17.x's built-in ROWaterfall processor (zROWaterfall_10..99) or TE's
// dragonRCSTemplate so every Falcon / Dragon / KRE / TT thruster has plumes.
// ============================================================================

// Suppress redundant SmokeScreen TundraPlume on single M1D & F9 v1.0 MVac
// when Waterfall is active (9-engine S1 clusters keep TundraPlume intact)
@PART[TE2_19_F9_Merlin_1D|TE_19_F910_S2_Engine]:BEFORE[TundraPlume]:NEEDS[RealismOverhaul,Waterfall,TundraExploration]
{
	!TUNDRAPLUME,* {}
}

// Single Sea-Level Merlin 1D Engine
@PART[TE2_19_F9_Merlin_1D]:BEFORE[ROWaterfall]:NEEDS[RealismOverhaul,Waterfall,TundraExploration]
{
	%ROWaterfall
	{
		template = waterfall-kerolox-lower-4
		audio = pump-fed-medium-1
		transform = thrustTransform
		position = 0, 0, 0
		rotation = 0, 0, 0
		scale = 0.72, 0.72, 0.72
		useRelativeScaling = true
	}
}

// Falcon 9 v1.0 Second Stage Merlin 1C Vacuum Engine
@PART[TE_19_F910_S2_Engine]:BEFORE[ROWaterfall]:NEEDS[RealismOverhaul,Waterfall,TundraExploration]
{
	%ROWaterfall
	{
		template = waterfall-kerolox-upper-3
		audio = pump-fed-light-1
		transform = thrustTransform
		position = 0, 0, 0.05
		rotation = 0, 0, 0
		scale = 1.6, 1.6, 1.6
		useRelativeScaling = true
	}
}

// Dragon 1 Cargo Pod (18x Draco RCS across RCS & RCS2 transforms)
@PART[TE_19_C-Dragon_Pod]:AFTER[TundraExploration]:NEEDS[RealismOverhaul,Waterfall,TundraExploration]
{
	!EFFECTS {}
	EFFECTS
	{
		running
		{
			AUDIO_MULTI_POOL
			{
				channel = Ship
				transformName = RCS
				clip = sound_rocket_mini
				volume = 0.0 0.0
				volume = 0.05 0.1
				volume = 1.0 0.2
				pitch = 0.0 0.5
				pitch = 1.0 1.0
				loop = true
			}
		}
		running2
		{
			AUDIO_MULTI_POOL
			{
				channel = Ship
				transformName = RCS2
				clip = sound_rocket_mini
				volume = 0.0 0.0
				volume = 0.05 0.1
				volume = 1.0 0.2
				pitch = 0.0 0.5
				pitch = 1.0 1.0
				loop = true
			}
		}
	}

	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = dragon1Rcs1FX
		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = rcs
			linkedTo = rcs
			thrusterTransformName = RCS
		}
		TEMPLATE
		{
			templateName = dragonRCSTemplate
			overrideParentTransform = RCS
			scale = 1.48, 1.48, 1.48
			rotation = 0, 0, 0
			position = 0, 0, 0
		}
	}

	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = dragon1Rcs2FX
		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = rcs
			linkedTo = rcs
			thrusterTransformName = RCS2
		}
		TEMPLATE
		{
			templateName = dragonRCSTemplate
			overrideParentTransform = RCS2
			scale = 1.48, 1.48, 1.48
			rotation = 0, 0, 0
			position = 0, 0, 0
		}
	}
}

// KRE Dual SuperDraco Nacelles (using official RO SuperDraco Waterfall template)
@PART[SmallCapsuleEngine|SmallCapsuleEngineRCS]:BEFORE[ROWaterfall]:NEEDS[RealismOverhaul,Waterfall,KerbalReusabilityExpansion]
{
	%ROWaterfall
	{
		template = rowaterfall-hypergolic-superdraco
		audio = pressure-fed-1
		transform = thrustTransform
		position = 0, 0, -0.02
		rotation = 0, 0, 0
		scale = 0.24, 0.24, 0.24
		useRelativeScaling = true
		ExtraTemplate
		{
			template = waterfall-nozzle-glow-orange-1
			transform = thrustTransform
			position = 0, 0, 0
			rotation = 0, 0, 0
			scale = 0.20, 0.20, 0.20
		}
	}
}

// KRE Cold-Gas Booster Thrusters (RO autoConfig = rcs -> translucent cold-gas N2)
@PART[HotGasThruster-M|HotGasThruster-L]:BEFORE[ROWaterfall]:NEEDS[RealismOverhaul,Waterfall,KerbalReusabilityExpansion]
{
	%ROWaterfall
	{
		autoConfig = rcs
		transform = RCSThrust
		position = 0, 0, 0
		rotation = 0, 0, 180
		scale = 1.0, 1.0, 1.0
		@scale[*] *= #$/rescaleFactor$
	}
}

// TundraTechnologies Satellites (Iridium NEXT & New Horizons Hydrazine RCS)
@PART[TT_19_IRI_BODY|TT_19_NH_RCS_1|TT_19_NH_RCS_2|TT_19_NH_RCS_3|TT_19_NH_RCS_4]:BEFORE[ROWaterfall]:NEEDS[RealismOverhaul,Waterfall,TundraTechnologies]
{
	%ROWaterfall
	{
		template = rowaterfall-rcs-hydrazine-1
		audio = rcs-jet-1
		transform = RCS
		position = 0, 0, 0
		rotation = 0, 0, 180
		scale = 0.35, 0.35, 0.35
		@scale[*] *= #$/rescaleFactor$
	}
}
